<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Brief</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page page-narrow">
    <div class="card form-card">
      <p class="eyebrow">✈️ Travel Brief</p>
      <h1>Plan your next trip</h1>
      <p class="subtitle">Tell us about yourself, then explore destinations on the map.</p>

      {% if error %}
        <div class="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/" class="form">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Priya" required>
        </div>
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="0" placeholder="e.g. 29" required>
        </div>
        <div class="field">
          <label for="home_location">Home location (city)</label>
          <input type="text" id="home_location" name="home_location" placeholder="e.g. Mumbai" required>
        </div>
        <button type="submit">Explore destinations</button>
      </form>
    </div>
  </main>
</body>
</html>
